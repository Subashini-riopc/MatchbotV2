# =============================================================================
# MatchBot — Global configuration (shared by ALL providers)
#
# This file holds everything the legacy system baked into Python classes:
# the canonical attribute dictionary, standardization maps (gender / suffixes),
# blocking keys, the matcher chain with weights/thresholds, and DQ rules.
#
# Onboarding a new provider does NOT require editing this file — only a new
# file under providers/. Edit here only to change matching behavior globally
# or to add a brand-new canonical attribute (also add it to the domain module).
# =============================================================================

# --- Canonical attribute dictionary -----------------------------------------
# Must match matchbot.domain.canonical exactly (validated on load).
canonical_attributes:
  - { name: first_name,  dtype: string, pii: true }
  - { name: middle_name, dtype: string, pii: true }
  - { name: last_name,   dtype: string, pii: true }
  - { name: birth_date,  dtype: date,   pii: true }
  - { name: ssn,         dtype: string, pii: true }
  - { name: gender,      dtype: string, pii: true }
  - { name: address1,    dtype: string, pii: true }
  - { name: address2,    dtype: string, pii: true }
  - { name: city,        dtype: string, pii: false }
  - { name: state,       dtype: string, pii: false }
  - { name: zip,         dtype: string, pii: false }
  - { name: member_external_id, dtype: string, pii: true }  # e.g. RIDE SASID

# --- Standardization (was hardcoded in legacy first_pass / derived_identifiers)
standardization:
  gender_map:
    F: FEMALE
    FEMALE: FEMALE
    M: MALE
    MALE: MALE
    NB: NONBINARY
    "X": NONBINARY
  name_suffixes: [JR, SR, II, III, IV, V, VI, ESQ]
  name_prefixes: [MR, MRS, MS, DR]
  # Street-suffix/directional abbreviations for address standardization
  # (std_address) — applied as whole-token replacements after uppercasing,
  # so "Main Street" and "Main St" compare equal. USPS-style abbreviations.
  address_abbreviations:
    STREET: ST
    AVENUE: AVE
    BOULEVARD: BLVD
    DRIVE: DR
    LANE: LN
    ROAD: RD
    COURT: CT
    PLACE: PL
    APARTMENT: APT
    SUITE: STE
    NORTH: N
    SOUTH: S
    EAST: E
    WEST: W

# --- Matching ----------------------------------------------------------------
matching:
  # Blocking keys cheaply narrow candidate members before scoring.
  blocking_keys:
    - name: external_id_exact
      attributes: [rilds_id]
    - name: ssn_exact
      attributes: [ssn]
    - name: lastname_dob
      attributes: [last_name, birth_date]
      phonetic: [last_name]
    - name: firstname_lastname_dob
      attributes: [first_name, last_name, birth_date]
      phonetic: [first_name, last_name]
    - name: firstname_lastname
      attributes: [first_name, last_name]
      phonetic: [first_name, last_name]

    # Broad phonetic net on last name alone — ensures candidates are found
    # for name-only providers (e.g. RIDE) even when first name differs.
    - name: last_name_only
      attributes: [last_name]
      phonetic: [last_name]

  # Ordered, all-exact-match cascade. First matcher to ACCEPT wins. Each
  # matcher independently requires every one of its `keys` to be present and
  # non-blank on the record — a record missing a rule's required field(s), or
  # for which the rule finds no exact-equal candidate, falls through to the
  # next rule in this list. No fuzzy matching, no confidence scoring: every
  # match here is either an exact-equality accept (score 1.0) or nothing.
  #
  # A provider whose file structurally never has a given field (e.g. RIDE has
  # no birth_date column at all) still lists this same global chain — no
  # provider-level override needed. That rule's key lookup returns None for
  # every record, so it's a fast, harmless skip for that provider's data,
  # never a false accept.
  matchers:
    # Strong provider-assigned id (e.g. RIDE SASID -> member_external_id via
    # that provider's own column_mappings, carried generically on stage as
    # rilds_id). Highest precedence.
    - name: deterministic_external_id
      type: deterministic
      keys: [rilds_id]

    - name: deterministic_ssn
      type: deterministic
      keys: [ssn]

    # Partial SSN (last 4 digits) isn't unique alone, but paired with both
    # full names it's a trustworthy signal — placed above name+DOB since SSN
    # is a stable identifier that doesn't drift with formatting the way
    # names/addresses do.
    - name: deterministic_name_ssn4
      type: deterministic
      keys: [first_name_std, last_name_std, ssn4]

    # Standardized name columns (suffixes/prefixes like JR, SR, DR stripped)
    # so exact comparison isn't defeated by formatting differences alone.
    - name: deterministic_name_dob
      type: deterministic
      keys: [first_name_std, last_name_std, birth_date]

    # --- Address tiers (rules 5-6). Both require both names exact; only
    # the address-field combination varies. Deliberately no zip-only tier
    # (too loose for an exact match — see
    # docs/snowflake-implementation-plan.md matching-logic discussion).
    # Rules 7-8 (deterministic_lastname_addr_state_zip,
    # deterministic_firstname_addr_state_zip — each dropping one of the two
    # name fields) were removed per explicit request: both carried real
    # household-collision risk (people sharing a last name + address, or a
    # first name + address, could false-match) with only state+zip as a
    # narrowing anchor.
    - name: deterministic_name_addr_city_state
      type: deterministic
      keys: [first_name_std, last_name_std, address1_std, city, state]

    # No city/state — anchored by address1+zip instead of address1+city+
    # state. A record only reaches this if rule 5's city/state comparison
    # didn't line up but name+address1+zip did.
    - name: deterministic_name_addr_zip
      type: deterministic
      keys: [first_name_std, last_name_std, address1_std, zip5]

    # --- Fuzzy tier. Only reached if every exact rule above fails. Each
    # scores similarity in [0,1]; score >= accept_threshold matches,
    # review_threshold <= score < accept_threshold is flagged for manual
    # review (routed to rilds_error with decision=LOW_CONFIDENCE), below
    # review_threshold is no match. fuzzy_name_addr_combined (nothing held
    # fully exact — six weak/partial signals corroborating each other) was
    # removed per explicit request; a record that would only have cleared
    # that loosest tier now ends up UNMATCHED instead of matched/reviewed.
    # Order below (exact-name-anchored first, exact-address-anchored
    # second) is per explicit request — not a strictness ranking.
    #
    # Score is purely address1_std (weight 100, threshold 0.90) —
    # first_name_std/last_name_std/zip5 carry weight 0 (not scored) but
    # are all marked required: true, a REAL hard precondition enforced
    # identically on both platforms (see FieldComparison.required's
    # docstring in config/models.py). Added after a live bug: with only
    # weight=0 (no required flag), a candidate in the wrong zip code/city/
    # state could still match purely on address1_std TEXT similarity —
    # e.g. two different "78 Oak Ave"s in different towns. required
    # closes that for real: first_name_std/last_name_std/zip5 must all
    # match exactly or this rule never fires for that candidate,
    # regardless of how similar the address text looks.
    - name: fuzzy_exact_name_addr
      type: fuzzy
      accept_threshold: 0.85
      review_threshold: 0.65
      comparisons:
        - attribute: first_name_std
          method: exact
          weight: 0
          threshold: 1.0
          required: true
        - attribute: last_name_std
          method: exact
          weight: 0
          threshold: 1.0
          required: true
        - attribute: zip5
          method: exact
          weight: 0
          threshold: 1.0
          required: true
        - attribute: address1_std
          method: jaro_winkler
          weight: 100
          threshold: 0.90

    # Score is purely first_name_std+last_name_std (50/50, threshold 0.90
    # each) — address1_std/zip5 stay in comparisons ONLY as the exact-match
    # SQL join anchor (weight 0, so they contribute nothing to the score).
    # Previously address1_std+zip5 alone (200 of 300 total weight) could
    # push a candidate to/past accept_threshold even with a totally
    # different first name (e.g. last_name(55)+address(100)+zip(100)=255
    # = 0.85, meeting the old accept_threshold with 0 contribution from
    # first_name) — a real false-match risk caught by inspecting live
    # matched records. Removing address1_std/zip5 from comparisons
    # entirely was considered and rejected: matchers/fuzzy.py's
    # _find_exact_anchor() scans this same comparisons list for the join
    # anchor, so removing them would silently fall back to a much looser
    # phonetic-only (last_name_metaphone1) join instead of the exact
    # address+zip anchor this rule is named for.
    - name: fuzzy_name_exact_addr
      type: fuzzy
      accept_threshold: 0.90
      review_threshold: 0.75
      comparisons:
        - attribute: first_name_std
          method: jaro_winkler
          weight: 50
          threshold: 0.90
        - attribute: last_name_std
          method: jaro_winkler
          weight: 50
          threshold: 0.90
        - attribute: address1_std
          method: exact
          weight: 0
          threshold: 1.0
        - attribute: zip5
          method: exact
          weight: 0
          threshold: 1.0

# --- Data-quality rules (evaluated during cleanse; recorded as metrics) ------
dq_rules:
  - { name: ssn_present,       attribute: ssn,        rule: not_null, severity: warn }
  - { name: ssn_format,        attribute: ssn,        rule: regex, pattern: '^\d{9}$', severity: warn }
  - { name: birth_date_present, attribute: birth_date, rule: not_null, severity: warn }
  - { name: last_name_present, attribute: last_name,  rule: not_null, severity: error }
  - { name: state_format,      attribute: state,      rule: length, min_length: 2, max_length: 2, severity: warn }
